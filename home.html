<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophia - Web Designer Portfolio</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <!-- Brand Logo -->
            <a class="navbar-brand font-weight-bold fs-3 fw-bold text-white" href="#">
                Sophia<span class="text-accent">.</span>
            </a>

            <!-- Mobile Toggle Button -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSophia">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarSophia">
                <div class="nav-pill-container d-flex flex-column flex-lg-row align-items-center my-3 my-lg-0">
                    <a class="nav-link-custom active" href="#home">Home</a>
                    <a class="nav-link-custom" href="#about">About</a>
                    <a class="nav-link-custom" href="#services">Service</a>
                    <a class="nav-link-custom" href="#projects">Projects</a>
                </div>
            </div>

            <!-- Contact CTA Button -->
            <div class="d-none d-lg-block">
                <a href="#contact" class="btn btn-accent rounded-pill px-4 py-2 fs-6">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="py-5">
        <div class="container min-vh-75 d-flex align-items-center">
            <div class="row w-100 align-items-center gy-5">
                
                <!-- Hero Left Text Content -->
                <div class="col-lg-6 hero-text-align">
                    <span class="sub-greeting">HI, I'M SOPHIA</span>
                    <h1 class="hero-title text-white">Web Designer</h1>
                    <p class="hero-description">
                        A young web designer with a passion for modern digital design. Crafting high-performance websites, engaging interfaces, and interactive user experiences.
                    </p>

                    <!-- Action Buttons -->
                    <div class="d-flex flex-wrap gap-3 btn-group-custom mb-5">
                        <a href="#contact" class="btn btn-accent">Hire me</a>
                        <a href="#resume" class="btn btn-outline-custom">Resume</a>
                    </div>

                    <!-- Social Proof Section -->
                    <div class="pt-3 border-top border-secondary border-opacity-25">
                        <p class="text-muted small fw-medium mb-3">Find me on</p>
                        <div class="d-flex align-items-center gap-3 social-container">
                            <a href="#" class="social-link" title="Pinterest">
                                <i class="fa-brands fa-pinterest-p"></i>
                            </a>
                            <a href="#" class="social-link" title="Behance">
                                <i class="fa-brands fa-behance"></i>
                            </a>
                            <a href="#" class="social-link" title="LinkedIn">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Hero Right Graphic Showcase Card -->
                <div class="col-lg-6">
                    <div class="hero-graphic-card">
                        <!-- Ambient Glowing Backdrops -->
                        <div class="glow-sphere-1"></div>
                        <div class="glow-sphere-2"></div>

                        <!-- Card Illustration Graphic -->
                        <div class="graphic-content text-center py-4">
                            <!-- Vector SVG Illustration representing Web Designer -->
                            <svg class="img-fluid" style="max-height: 420px;" viewBox="0 0 300 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Background Decorative Ring -->
                                <circle cx="150" cy="160" r="110" fill="#FF4B4B" fill-opacity="0.12"/>
                                <circle cx="150" cy="160" r="85" stroke="#FF4B4B" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>

                                <!-- Torso & Clothes -->
                                <path d="M75 290 C75 220, 110 200, 150 200 C190 200, 225 220, 225 290 Z" fill="#252330"/>
                                <path d="M120 200 L180 200 L165 240 L135 240 Z" fill="#1A1921"/>
                                <path d="M135 205 L165 205 L150 245 Z" fill="#FF4B4B"/>

                                <!-- Neck & Face -->
                                <rect x="138" y="175" width="24" height="28" rx="6" fill="#F4B099"/>
                                <ellipse cx="150" cy="140" rx="42" ry="48" fill="#F4B099"/>

                                <!-- Sunglasses -->
                                <rect x="115" y="128" width="30" height="22" rx="6" fill="#121117"/>
                                <rect x="155" y="128" width="30" height="22" rx="6" fill="#121117"/>
                                <line x1="145" y1="138" x2="155" y2="138" stroke="#121117" stroke-width="4"/>
                                <line x1="120" y1="132" x2="132" y2="144" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                                <line x1="160" y1="132" x2="172" y2="144" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

                                <!-- Smile -->
                                <path d="M140 168 Q150 176 160 168" stroke="#D1745E" stroke-width="3" stroke-linecap="round" fill="none"/>

                                <!-- Hair braids/strands -->
                                <path d="M108 130 C95 150, 92 190, 98 230" stroke="#4A1825" stroke-width="16" stroke-linecap="round"/>
                                <path d="M192 130 C205 150, 208 190, 202 230" stroke="#4A1825" stroke-width="16" stroke-linecap="round"/>

                                <!-- Red Cap / Beanie -->
                                <path d="M102 135 C102 90, 198 90, 198 135 Z" fill="#FF4B4B"/>
                                <rect x="98" y="125" width="104" height="16" rx="8" fill="#D63030"/>
                                <circle cx="150" cy="80" r="14" fill="#FF4B4B"/>
                            </svg>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
